name: Build Nova Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nova
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Download llama.cpp Android source
        env:
          LLAMA_CPP_TAG: b12193
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            "https://codeload.github.com/ggml-org/llama.cpp/zip/refs/tags/${LLAMA_CPP_TAG}" \
            --output "$RUNNER_TEMP/llama.cpp.zip"
          unzip -q "$RUNNER_TEMP/llama.cpp.zip" -d "$RUNNER_TEMP/llama.cpp"
          mv "$RUNNER_TEMP/llama.cpp/llama.cpp-${LLAMA_CPP_TAG}" \
            android/llama.cpp

      - name: Build and verify APK
        working-directory: android
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
            | grep -F "package: name='com.nova.android'"
          cp "$apk" app/build/outputs/apk/debug/Nova.apk

      - name: Upload APK for this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Android-APK
          path: android/app/build/outputs/apk/debug/Nova.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            android/app/build/outputs/apk/debug/Nova.apk \
            --title "Nova Android $GITHUB_REF_NAME" \
            --notes "Install Nova on Android 13 or later (ARM64 or x86-64). The app downloads its 533 MB AI model the first time you open it. Wi-Fi is recommended."
